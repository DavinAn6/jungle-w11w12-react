name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check

# on	            PR이 열리거나 갱신될 때, main에 push될 때 실행함
# runs-on	        GitHub의 Linux 서버에서 실행함
# setup-node	    Node.js LTS를 설치하고 npm 캐시를 사용해 속도를 높임
# npm ci	        package-lock.json 기준으로 정확한 버전을 설치함 (그래서 lock 파일이 커밋되어 있어야 함)
# npm run check	  로컬에서 쓰는 것과 같은 검사(타입, Biome, 테스트)를 실행함